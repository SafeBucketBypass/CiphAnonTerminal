<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Terminal</title>

  <style>
    :root {
      --white: #ffffff;
      --black: #000000;
      --gray: #555555;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--white);
      color: var(--black);
      font-family: "Courier New", Courier, monospace;
    }

    body {
      transition:
        background-color 0.06s linear,
        color 0.06s linear,
        filter 0.06s linear;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--white);
    }

    /* Glitch blocks */
    #glitchBlocks {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      overflow: hidden;
    }

    .glitchBlock {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .glitchBlock.black {
      background: #000000;
    }

    .glitchBlock.white {
      background: #ffffff;
      border: 1px solid #000000;
    }

    .glitchBlock.active {
      animation: blockGlitch 0.2s steps(2, end);
    }

    @keyframes blockGlitch {
      0% {
        opacity: 0;
        transform: translateX(0);
      }

      20% {
        opacity: 1;
      }

      55% {
        opacity: 0.35;
        transform: translateX(13px);
      }

      100% {
        opacity: 0;
        transform: translateX(-9px);
      }
    }

    #screenFlash {
      position: fixed;
      inset: 0;
      z-index: 45;
      opacity: 0;
      pointer-events: none;
      background: #000000;
    }

    #screenFlash.active {
      animation: screenFlashAnimation 0.16s steps(2, end);
    }

    @keyframes screenFlashAnimation {
      0% {
        opacity: 0;
        background: #000000;
      }

      25% {
        opacity: 0.85;
        background: #ffffff;
      }

      55% {
        opacity: 0.7;
        background: #000000;
      }

      100% {
        opacity: 0;
        background: #ffffff;
      }
    }

    #scanlines {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.13) 4px
      );
      mix-blend-mode: multiply;
    }

    #scanlines.active {
      opacity: 1;
      animation: scanMove 0.2s steps(2, end) infinite;
    }

    @keyframes scanMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 14px;
      }
    }

    .invert {
      filter: invert(1);
    }

    /* Intro */
    #introScreen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: #ffffff;
      color: #000000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #introScreen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #introBox {
      width: min(1200px, 96vw);
      text-align: center;
    }

    #introTitle {
      margin-bottom: 18px;
      font-size: clamp(12px, 2vw, 19px);
      font-weight: bold;
      letter-spacing: 3px;
    }

    #introStatus {
      min-height: 23px;
      margin-bottom: 18px;
      color: #333333;
      font-size: clamp(10px, 1.4vw, 15px);
      letter-spacing: 1px;
    }

    #introAscii {
      width: 100%;
      max-height: 62vh;
      margin: 0 auto;
      overflow: hidden;
      white-space: pre;
      text-align: center;
      color: #000000;
      font-size: clamp(5px, 0.78vw, 13px);
      line-height: 1.04;
      font-weight: bold;
    }

    #loadingBar {
      width: min(700px, 90vw);
      height: 15px;
      margin: 25px auto 0;
      padding: 2px;
      border: 2px solid #000000;
      background: #ffffff;
    }

    #loadingProgress {
      width: 0%;
      height: 100%;
      background: #000000;
      transition: width 0.08s linear;
    }

    /* Main terminal */
    #terminalScreen {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      color: #000000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    #terminalScreen.visible {
      opacity: 1;
      visibility: visible;
    }

    #terminalHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 24px;
      border-bottom: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      font-size: 13px;
      letter-spacing: 1px;
    }

    #headerStatus {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #statusDot {
      width: 9px;
      height: 9px;
      background: #000000;
      animation: blink 0.85s steps(1, end) infinite;
    }

    #terminalContent {
      flex: 1;
      overflow-y: auto;
      padding: 26px clamp(15px, 7vw, 120px) 125px;
      scroll-behavior: smooth;
      background: #ffffff;
    }

    #asciiArt {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto 32px;
      overflow-x: auto;
      white-space: pre;
      text-align: center;
      color: #000000;
      font-size: clamp(5px, 0.78vw, 13px);
      line-height: 1.04;
      font-weight: bold;
    }

    #terminalOutput {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      color: #000000;
      font-size: clamp(12px, 1.45vw, 16px);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .outputLine {
      min-height: 1.6em;
    }

    .commandLine {
      font-weight: bold;
    }

    .muted {
      color: var(--gray);
    }

    .errorLine {
      text-decoration: underline;
    }

    /* Actual typing area */
    #commandForm {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      min-height: 64px;
      padding: 17px 24px;
      border-top: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      font-size: clamp(12px, 1.5vw, 17px);
    }

    #prompt {
      flex: 0 0 auto;
      margin-right: 10px;
      color: #000000;
      font-weight: bold;
      white-space: nowrap;
    }

    #inputWrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      min-width: 0;
    }

    #commandInput {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 0;
      background: transparent;
      color: #000000;
      caret-color: transparent;
      font: inherit;
    }

    #commandInput::placeholder {
      color: #555555;
      opacity: 1;
    }

    /*
      This black block is the custom terminal cursor.
      It moves before the next character as the user types.
    */
    #customCursor {
      position: absolute;
      top: 50%;
      left: 0;
      width: 0.62em;
      height: 1.1em;
      transform: translateY(-50%);
      background: #000000;
      pointer-events: none;
      animation: cursorBlink 0.85s steps(1, end) infinite;
    }

    @keyframes cursorBlink {
      0%,
      45% {
        opacity: 1;
      }

      46%,
      100% {
        opacity: 0;
      }
    }

    /* Error box */
    #errorMessage {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 100;
      width: min(550px, 88vw);
      padding: 22px;
      transform: translate(-50%, -50%);
      border: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      text-align: center;
      white-space: pre-wrap;
    }

    #errorMessage.visible {
      display: block;
    }

    @media (max-width: 600px) {
      #introAscii,
      #asciiArt {
        font-size: 5px;
      }

      #terminalHeader {
        padding: 14px;
        font-size: 10px;
      }

      #terminalContent {
        padding: 20px 12px 115px;
      }

      #commandForm {
        min-height: 56px;
        padding: 14px 12px;
      }

      #prompt {
        margin-right: 7px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <div id="glitchBlocks"></div>
    <div id="screenFlash"></div>
    <div id="scanlines"></div>

    <section id="introScreen">
      <div id="introBox">
        <div id="introTitle">INITIALIZING ASCII TERMINAL</div>
        <div id="introStatus">CONNECTING...</div>

        <pre id="introAscii"></pre>

        <div id="loadingBar">
          <div id="loadingProgress"></div>
        </div>
      </div>
    </section>

    <section id="terminalScreen">
      <header id="terminalHeader">
        <span>ASCII COMMAND TERMINAL</span>

        <span id="headerStatus">
          <span id="statusDot"></span>
          ONLINE
        </span>
      </header>

      <div id="terminalContent">
        <pre id="asciiArt"></pre>
        <div id="terminalOutput"></div>
      </div>

      <form id="commandForm" autocomplete="off">
        <span id="prompt">guest@ascii:~$</span>

        <div id="inputWrapper">
          <input
            id="commandInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="type help to see commands"
          />

          <span id="customCursor"></span>
        </div>
      </form>
    </section>

    <div id="errorMessage"></div>
  </main>

  <script>

      This is the exact ASCII supplied in your message.
      It is embedded directly so the page does not depend on a TXT file.

    const settings = {
      introDuration: 7000,
      typingSpeed: 5,
      glitchChance: 0.82,
      blockCount: 20,
      glitchInterval: 125
    };

    const introScreen = document.getElementById("introScreen");
    const introStatus = document.getElementById("introStatus");
    const introAscii = document.getElementById("introAscii");
    const loadingProgress = document.getElementById("loadingProgress");

    const terminalScreen = document.getElementById("terminalScreen");
    const terminalContent = document.getElementById("terminalContent");
    const asciiArt = document.getElementById("asciiArt");
    const terminalOutput = document.getElementById("terminalOutput");

    const commandForm = document.getElementById("commandForm");
    const commandInput = document.getElementById("commandInput");
    const inputWrapper = document.getElementById("inputWrapper");
    const customCursor = document.getElementById("customCursor");

    const glitchBlocks = document.getElementById("glitchBlocks");
    const screenFlash = document.getElementById("screenFlash");
    const scanlines = document.getElementById("scanlines");
    const errorMessage = document.getElementById("errorMessage");

    const introMessages = [
      "CONNECTING TO TERMINAL...",
      "CHECKING DISPLAY BUFFER...",
      "READING ASCII DATA...",
      "RENDERING CHARACTER MAP...",
      "APPLYING DISPLAY EFFECTS...",
      "STARTING COMMAND INPUT...",
      "SYSTEM READY."
    ];

    let commandHistory = [];
    let historyIndex = -1;
    let glitchTimer = null;
    let introRunId = 0;
    let introComplete = false;

    function randomNumber(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function wait(milliseconds) {
      return new Promise((resolve) => {
        setTimeout(resolve, milliseconds);
      });
    }

    function addOutput(text = "", className = "") {
      const line = document.createElement("div");
      line.className = `outputLine ${className}`;
      line.textContent = text;
      terminalOutput.appendChild(line);
      scrollTerminal();
    }

    function scrollTerminal() {
      terminalContent.scrollTop = terminalContent.scrollHeight;
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add("visible");

      setTimeout(() => {
        errorMessage.classList.remove("visible");
      }, 6000);
    }

    function createGlitchBlocks() {
      glitchBlocks.innerHTML = "";

      for (let i = 0; i < settings.blockCount; i++) {
        const block = document.createElement("div");
        block.className = "glitchBlock";
        glitchBlocks.appendChild(block);
      }
    }

    function flashRandomBlock() {
      const blocks = glitchBlocks.querySelectorAll(".glitchBlock");

      if (!blocks.length || Math.random() > settings.glitchChance) {
        return;
      }

      const block = blocks[randomNumber(0, blocks.length - 1)];

      block.classList.remove("black", "white", "active");
      block.classList.add(Math.random() > 0.5 ? "black" : "white");

      block.style.left = `${randomNumber(-5, 95)}%`;
      block.style.top = `${randomNumber(-5, 95)}%`;
      block.style.width = `${randomNumber(2, 35)}%`;
      block.style.height = `${randomNumber(1, 18)}%`;

      void block.offsetWidth;
      block.classList.add("active");

      setTimeout(() => {
        block.classList.remove("active");
      }, randomNumber(100, 280));
    }

    function flashScreenNow() {
      if (Math.random() > settings.glitchChance) {
        return;
      }

      screenFlash.classList.remove("active");
      void screenFlash.offsetWidth;
      screenFlash.classList.add("active");

      if (Math.random() > 0.5) {
        document.body.classList.add("invert");

        setTimeout(() => {
          document.body.classList.remove("invert");
        }, randomNumber(50, 170));
      }
    }

    function startGlitches() {
      createGlitchBlocks();
      scanlines.classList.add("active");

      glitchTimer = setInterval(() => {
        flashRandomBlock();
        flashScreenNow();
      }, settings.glitchInterval);
    }

    function stopGlitches() {
      clearInterval(glitchTimer);
      glitchTimer = null;
      scanlines.classList.remove("active");
      document.body.classList.remove("invert");
      screenFlash.classList.remove("active");
    }

    async function typeIntroAscii(text, runId) {
      introAscii.textContent = "";

      for (let i = 0; i < text.length; i++) {
        if (runId !== introRunId) {
          return;
        }

        introAscii.textContent += text[i];

        if (i % 13 === 0) {
          flashRandomBlock();
        }

        if (i % 32 === 0) {
          flashScreenNow();
        }

        await wait(settings.typingSpeed);
      }
    }

    async function runIntro() {
      const runId = ++introRunId;
      const startTime = Date.now();

      introComplete = false;
      introAscii.textContent = "";
      loadingProgress.style.width = "0%";
      introStatus.textContent = "CONNECTING...";

      startGlitches();

      const typingPromise = typeIntroAscii(ASCII_ART, runId);

      const progressTimer = setInterval(() => {
        if (runId !== introRunId) {
          clearInterval(progressTimer);
          return;
        }

        const elapsed = Date.now() - startTime;
        const percentage = Math.min(
          100,
          (elapsed / settings.introDuration) * 100
        );

        loadingProgress.style.width = `${percentage}%`;

        const messageIndex = Math.min(
          introMessages.length - 1,
          Math.floor((percentage / 100) * introMessages.length)
        );

        introStatus.textContent = introMessages[messageIndex];

        if (percentage >= 100) {
          clearInterval(progressTimer);
        }
      }, 70);

      await typingPromise;

      const remaining =
        settings.introDuration - (Date.now() - startTime);

      if (remaining > 0) {
        await wait(remaining);
      }

      if (runId === introRunId) {
        finishIntro();
      }
    }

    function finishIntro() {
      if (introComplete) {
        return;
      }

      introComplete = true;
      stopGlitches();

      introScreen.classList.add("hidden");
      terminalScreen.classList.add("visible");

      asciiArt.textContent = ASCII_ART;

      setTimeout(() => {
        addOutput("System ready.");
        addOutput('Type "help" to see available commands.', "muted");
        addOutput("");
        commandInput.focus();
        updateCursorPosition();
      }, 700);
    }

    function executeCommand(rawCommand) {
      const commandLine = rawCommand.trim();

      if (!commandLine) {
        addOutput("");
        return;
      }

      addOutput(`guest@ascii:~$ ${commandLine}`, "commandLine");

      const parts = commandLine.split(/\s+/);
      const command = parts[0].toLowerCase();
      const argument = parts.slice(1).join(" ");

      switch (command) {
        case "help":
        case "?":
          addOutput("AVAILABLE COMMANDS");
          addOutput("------------------");
          addOutput("help       Show available commands");
          addOutput("clear      Clear terminal output");
          addOutput("ascii      Redisplay the ASCII");
          addOutput("about      Show terminal information");
          addOutput("status     Show simulated status");
          addOutput("date       Show the current date and time");
          addOutput("echo TEXT  Print text");
          addOutput("whoami     Show the current user");
          addOutput("glitch     Trigger a visual glitch");
          addOutput("reboot     Restart the intro sequence");
          addOutput("");
          break;

        case "clear":
        case "cls":
          terminalOutput.innerHTML = "";
          break;

        case "ascii":
        case "show":
          asciiArt.textContent = ASCII_ART;
          addOutput("ASCII display refreshed.");
          break;

        case "about":
          addOutput("ASCII COMMAND TERMINAL");
          addOutput("White background / black text interface.");
          addOutput("The ASCII is embedded directly in this HTML file.");
          addOutput("");
          break;

        case "status":
          addOutput("DISPLAY   ONLINE");
          addOutput("ASCII     READY");
          addOutput("INPUT     READY");
          addOutput("NETWORK   NOT USED");
          addOutput("");
          break;

        case "date":
        case "time":
          addOutput(new Date().toString());
          break;

        case "echo":
          addOutput(argument);
          break;

        case "whoami":
          addOutput("guest");
          break;

        case "glitch":
          flashRandomBlock();
          flashScreenNow();
          addOutput("Glitch effect triggered.");
          break;

        case "reboot":
        case "restart":
          rebootTerminal();
          break;

        default:
          addOutput(
            `Command not found: ${command}. Type "help" for commands.`,
            "errorLine"
          );
      }
    }

    async function rebootTerminal() {
      introRunId++;
      stopGlitches();

      terminalScreen.classList.remove("visible");
      introScreen.classList.remove("hidden");
      terminalOutput.innerHTML = "";

      await wait(450);
      runIntro();
    }

    /*
      Move the black block cursor to the actual end of the typed text.
    */
    function updateCursorPosition() {
      const typedText = commandInput.value;

      const measurement = document.createElement("span");
      const inputStyles = window.getComputedStyle(commandInput);

      measurement.style.position = "absolute";
      measurement.style.visibility = "hidden";
      measurement.style.whiteSpace = "pre";
      measurement.style.font = inputStyles.font;
      measurement.style.fontFamily = inputStyles.fontFamily;
      measurement.style.fontSize = inputStyles.fontSize;
      measurement.style.fontWeight = inputStyles.fontWeight;
      measurement.textContent = typedText;

      inputWrapper.appendChild(measurement);

      const textWidth = measurement.getBoundingClientRect().width;
      measurement.remove();

      customCursor.style.left = `${textWidth}px`;
    }

    commandForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const command = commandInput.value;

      if (command.trim()) {
        commandHistory.push(command);
      }

      historyIndex = commandHistory.length;
      executeCommand(command);

      commandInput.value = "";
      updateCursorPosition();
      commandInput.focus();
    });

    commandInput.addEventListener("input", updateCursorPosition);

    commandInput.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp") {
        event.preventDefault();

        if (!commandHistory.length) {
          return;
        }

        historyIndex = Math.max(0, historyIndex - 1);
        commandInput.value = commandHistory[historyIndex];
        updateCursorPosition();
      }

      if (event.key === "ArrowDown") {
        event.preventDefault();

        if (!commandHistory.length) {
          return;
        }

        historyIndex = Math.min(
          commandHistory.length,
          historyIndex + 1
        );

        commandInput.value =
          historyIndex === commandHistory.length
            ? ""
            : commandHistory[historyIndex];

        updateCursorPosition();
      }

      if (event.key === "Tab") {
        event.preventDefault();

        const commands = [
          "help",
          "clear",
          "ascii",
          "about",
          "status",
          "date",
          "echo ",
          "whoami",
          "glitch",
          "reboot"
        ];

        const currentText = commandInput.value.toLowerCase();

        const match = commands.find((command) =>
          command.startsWith(currentText)
        );

        if (match) {
          commandInput.value = match;
          updateCursorPosition();
        }
      }
    });

    window.addEventListener("resize", updateCursorPosition);

    document.addEventListener("click", () => {
      if (terminalScreen.classList.contains("visible")) {
        commandInput.focus();
        updateCursorPosition();
      }
    });

    function start() {
      if (!ASCII_ART.trim()) {
        showError("ASCII ART IS EMPTY");
        return;
      }

      runIntro();
    }

    window.addEventListener("load", start);
  </script>
</body>
