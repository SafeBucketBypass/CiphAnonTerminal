<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Terminal</title>

  <style>
    :root {
      --white: #ffffff;
      --black: #000000;
      --gray: #777777;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--white);
      color: var(--black);
      font-family: "Courier New", Courier, monospace;
    }

    body {
      transition: background 0.08s linear, color 0.08s linear;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--white);
    }

    /* Glitch blocks */
    #glitchBlocks {
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow: hidden;
      pointer-events: none;
    }

    .glitchBlock {
      position: absolute;
      opacity: 0;
      background: #000;
      mix-blend-mode: difference;
    }

    .glitchBlock.show {
      animation: blockGlitch 0.2s steps(2, end);
    }

    @keyframes blockGlitch {
      0% {
        opacity: 0;
        transform: translateX(0);
      }

      25% {
        opacity: 1;
      }

      60% {
        opacity: 0.25;
        transform: translateX(15px);
      }

      100% {
        opacity: 0;
        transform: translateX(-10px);
      }
    }

    #screenFlash {
      position: fixed;
      inset: 0;
      z-index: 45;
      opacity: 0;
      pointer-events: none;
      background: #000;
    }

    #screenFlash.flash {
      animation: screenFlashAnimation 0.18s steps(2, end);
    }

    @keyframes screenFlashAnimation {
      0% {
        opacity: 0;
        background: #000;
      }

      25% {
        opacity: 0.9;
        background: #fff;
      }

      55% {
        opacity: 0.65;
        background: #000;
      }

      100% {
        opacity: 0;
        background: #fff;
      }
    }

    #scanlines {
      position: fixed;
      inset: 0;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.15) 4px
      );
      mix-blend-mode: multiply;
    }

    #scanlines.active {
      opacity: 1;
      animation: scanlineMove 0.18s steps(2, end) infinite;
    }

    @keyframes scanlineMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 14px;
      }
    }

    .invert {
      filter: invert(1);
    }

    /* Intro */
    #introScreen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: #fff;
      color: #000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #introScreen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #introBox {
      width: min(1000px, 94vw);
      text-align: center;
    }

    #introTitle {
      margin-bottom: 18px;
      font-size: clamp(12px, 2vw, 19px);
      font-weight: bold;
      letter-spacing: 3px;
    }

    #introStatus {
      min-height: 22px;
      margin-bottom: 18px;
      color: #444;
      font-size: clamp(10px, 1.4vw, 15px);
      letter-spacing: 1px;
    }

    #introAscii {
      max-width: 100%;
      max-height: 58vh;
      margin: 0 auto;
      overflow: hidden;
      white-space: pre;
      text-align: center;
      font-size: clamp(7px, 1.15vw, 17px);
      line-height: 1.12;
      font-weight: bold;
    }

    #loadingBar {
      width: min(700px, 90vw);
      height: 15px;
      margin: 28px auto 0;
      padding: 2px;
      border: 2px solid #000;
    }

    #loadingProgress {
      width: 0%;
      height: 100%;
      background: #000;
      transition: width 0.08s linear;
    }

    /* Terminal */
    #terminalScreen {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: #000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    #terminalScreen.visible {
      opacity: 1;
      visibility: visible;
    }

    #terminalHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 24px;
      border-bottom: 2px solid #000;
      font-size: 13px;
      letter-spacing: 1px;
    }

    #onlineStatus {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #onlineDot {
      width: 9px;
      height: 9px;
      background: #000;
      animation: blink 0.85s steps(1, end) infinite;
    }

    #terminalContent {
      flex: 1;
      overflow-y: auto;
      padding: 30px clamp(15px, 7vw, 120px) 125px;
      scroll-behavior: smooth;
    }

    #asciiArt {
      max-width: 100%;
      margin: 0 auto 35px;
      overflow-x: auto;
      white-space: pre;
      text-align: center;
      font-size: clamp(7px, 1.15vw, 17px);
      line-height: 1.12;
      font-weight: bold;
    }

    #terminalOutput {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: clamp(12px, 1.45vw, 16px);
      line-height: 1.6;
    }

    .outputLine {
      min-height: 1.6em;
    }

    .commandLine {
      font-weight: bold;
    }

    .muted {
      color: var(--gray);
    }

    .errorLine {
      text-decoration: underline;
    }

    /* Input */
    #commandForm {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 17px 24px;
      border-top: 2px solid #000;
      background: rgba(255, 255, 255, 0.97);
      font-size: clamp(12px, 1.5vw, 17px);
    }

    #prompt {
      flex: 0 0 auto;
      font-weight: bold;
      white-space: nowrap;
    }

    #commandInput {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 0;
      background: transparent;
      color: #000;
      font: inherit;
      caret-color: #000;
    }

    #commandInput::placeholder {
      color: #777;
      opacity: 1;
    }

    #cursor {
      width: 10px;
      height: 19px;
      flex: 0 0 auto;
      background: #000;
      animation: blink 0.85s steps(1, end) infinite;
    }

    @keyframes blink {
      0%,
      45% {
        opacity: 1;
      }

      46%,
      100% {
        opacity: 0;
      }
    }

    /* Error */
    #errorMessage {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 100;
      width: min(500px, 86vw);
      padding: 20px;
      transform: translate(-50%, -50%);
      border: 2px solid #000;
      background: #fff;
      color: #000;
      text-align: center;
      white-space: pre-wrap;
    }

    #errorMessage.visible {
      display: block;
    }

    @media (max-width: 600px) {
      #introAscii,
      #asciiArt {
        font-size: 7px;
      }

      #terminalHeader {
        padding: 14px;
        font-size: 10px;
      }

      #terminalContent {
        padding: 20px 12px 115px;
      }

      #commandForm {
        padding: 14px 12px;
      }

      #prompt {
        font-size: 11px;
      }

      #cursor {
        width: 8px;
        height: 15px;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <div id="glitchBlocks"></div>
    <div id="screenFlash"></div>
    <div id="scanlines"></div>

    <section id="introScreen">
      <div id="introBox">
        <div id="introTitle">INITIALIZING ASCII TERMINAL</div>
        <div id="introStatus">CONNECTING...</div>

        <pre id="introAscii"></pre>

        <div id="loadingBar">
          <div id="loadingProgress"></div>
        </div>
      </div>
    </section>

    <section id="terminalScreen">
      <header id="terminalHeader">
        <span>ASCII COMMAND TERMINAL</span>

        <span id="onlineStatus">
          <span id="onlineDot"></span>
          ONLINE
        </span>
      </header>

      <div id="terminalContent">
        <pre id="asciiArt"></pre>
        <div id="terminalOutput"></div>
      </div>

      <form id="commandForm" autocomplete="off">
        <span id="prompt">guest@ascii:~$</span>

        <input
          id="commandInput"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="type help to see commands"
        />

        <span id="cursor"></span>
      </form>
    </section>

    <div id="errorMessage"></div>
  </main>

  <script>
    /*
      These are raw GitHub URLs for your repository files.
      This avoids the TXT file failing to load on GitHub Pages.
    */

    const asciiFiles = [
      "https://raw.githubusercontent.com/SafeBucketBypass/CiphAnonTerminal/main/1000016546-ascii.txt",
      "https://raw.githubusercontent.com/SafeBucketBypass/CiphAnonTerminal/main/1000016679-ascii.txt"
    ];

    const settings = {
      introDuration: 7000,
      typingSpeed: 10,
      glitchChance: 0.82,
      glitchBlockCount: 20,
      glitchInterval: 125
    };

    const introScreen = document.getElementById("introScreen");
    const introStatus = document.getElementById("introStatus");
    const introAscii = document.getElementById("introAscii");
    const loadingProgress = document.getElementById("loadingProgress");

    const terminalScreen = document.getElementById("terminalScreen");
    const terminalContent = document.getElementById("terminalContent");
    const asciiArt = document.getElementById("asciiArt");
    const terminalOutput = document.getElementById("terminalOutput");

    const commandForm = document.getElementById("commandForm");
    const commandInput = document.getElementById("commandInput");

    const glitchBlocks = document.getElementById("glitchBlocks");
    const screenFlash = document.getElementById("screenFlash");
    const scanlines = document.getElementById("scanlines");
    const errorMessage = document.getElementById("errorMessage");

    const introMessages = [
      "CONNECTING TO TERMINAL...",
      "SEARCHING FOR ASCII DATA...",
      "READING TEXT FILES...",
      "RENDERING CHARACTER MAP...",
      "APPLYING GLITCH EFFECTS...",
      "LOADING COMMAND INTERFACE...",
      "SYSTEM READY."
    ];

    let loadedAscii = [];
    let currentAsciiIndex = 0;
    let commandHistory = [];
    let historyIndex = -1;
    let glitchInterval = null;
    let introRun = 0;
    let introComplete = false;

    function randomNumber(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function wait(milliseconds) {
      return new Promise((resolve) => {
        setTimeout(resolve, milliseconds);
      });
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add("visible");

      setTimeout(() => {
        errorMessage.classList.remove("visible");
      }, 7000);
    }

    async function loadAsciiFile(url) {
      const response = await fetch(url, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`${url} returned HTTP ${response.status}`);
      }

      const text = await response.text();

      if (!text.trim()) {
        throw new Error(`${url} is empty`);
      }

      return text;
    }

    async function loadAllAsciiFiles() {
      const results = [];

      for (const url of asciiFiles) {
        try {
          const text = await loadAsciiFile(url);
          results.push(text);
        } catch (error) {
          console.error("ASCII file failed:", error);
        }
      }

      return results;
    }

    function createGlitchBlocks() {
      glitchBlocks.innerHTML = "";

      for (let i = 0; i < settings.glitchBlockCount; i++) {
        const block = document.createElement("div");
        block.className = "glitchBlock";
        glitchBlocks.appendChild(block);
      }
    }

    function flashRandomBlock() {
      const blocks = glitchBlocks.querySelectorAll(".glitchBlock");

      if (!blocks.length || Math.random() > settings.glitchChance) {
        return;
      }

      const block = blocks[randomNumber(0, blocks.length - 1)];

      block.style.left = `${randomNumber(-5, 95)}%`;
      block.style.top = `${randomNumber(-5, 95)}%`;
      block.style.width = `${randomNumber(2, 35)}%`;
      block.style.height = `${randomNumber(1, 18)}%`;

      block.classList.remove("show");
      void block.offsetWidth;
      block.classList.add("show");

      setTimeout(() => {
        block.classList.remove("show");
      }, randomNumber(100, 280));
    }

    function flashScreen() {
      if (Math.random() > settings.glitchChance) {
        return;
      }

      screenFlash.classList.remove("flash");
      void screenFlash.offsetWidth;
      screenFlash.classList.add("flash");

      if (Math.random() > 0.45) {
        document.body.classList.add("invert");

        setTimeout(() => {
          document.body.classList.remove("invert");
        }, randomNumber(50, 180));
      }
    }

    function startGlitches() {
      createGlitchBlocks();
      scanlines.classList.add("active");

      glitchInterval = setInterval(() => {
        flashRandomBlock();
        flashScreen();
      }, settings.glitchInterval);
    }

    function stopGlitches() {
      clearInterval(glitchInterval);
      glitchInterval = null;
      scanlines.classList.remove("active");
      document.body.classList.remove("invert");
      screenFlash.classList.remove("flash");
    }

    function displayAscii(index = 0) {
      if (!loadedAscii.length) {
        asciiArt.textContent =
          "NO ASCII FILE LOADED\n\n" +
          "Check the raw GitHub file URLs.";
        return;
      }

      currentAsciiIndex =
        (index + loadedAscii.length) % loadedAscii.length;

      asciiArt.textContent = loadedAscii[currentAsciiIndex];
    }

    async function typeIntroAscii(text, runId) {
      introAscii.textContent = "";

      for (let i = 0; i < text.length; i++) {
        if (runId !== introRun) {
          return;
        }

        introAscii.textContent += text[i];

        if (i % 20 === 0) {
          flashRandomBlock();
        }

        if (i % 35 === 0) {
          flashScreen();
        }

        await wait(settings.typingSpeed);
      }
    }

    async function runIntro() {
      const runId = ++introRun;
      const startTime = Date.now();

      introComplete = false;
      introAscii.textContent = "";
      loadingProgress.style.width = "0%";
      introStatus.textContent = "CONNECTING...";

      startGlitches();

      const text =
        loadedAscii[0] ||
        "ASCII FILE COULD NOT BE LOADED\n\nCHECK FILE URL";

      const typing = typeIntroAscii(text, runId);

      const progressTimer = setInterval(() => {
        if (runId !== introRun) {
          clearInterval(progressTimer);
          return;
        }

        const elapsed = Date.now() - startTime;
        const percentage = Math.min(
          100,
          (elapsed / settings.introDuration) * 100
        );

        loadingProgress.style.width = `${percentage}%`;

        const messageIndex = Math.min(
          introMessages.length - 1,
          Math.floor((percentage / 100) * introMessages.length)
        );

        introStatus.textContent = introMessages[messageIndex];

        if (percentage >= 100) {
          clearInterval(progressTimer);
        }
      }, 70);

      await typing;

      const remaining =
        settings.introDuration - (Date.now() - startTime);

      if (remaining > 0) {
        await wait(remaining);
      }

      if (runId === introRun) {
        finishIntro();
      }
    }

    function finishIntro() {
      if (introComplete) {
        return;
      }

      introComplete = true;
      stopGlitches();

      introScreen.classList.add("hidden");
      terminalScreen.classList.add("visible");

      displayAscii(0);

      setTimeout(() => {
        addOutput("System ready.");
        addOutput('Type "help" to see available commands.', "muted");
        addOutput("");
        commandInput.focus();
      }, 700);
    }

    function addOutput(text = "", className = "") {
      const line = document.createElement("div");
      line.className = `outputLine ${className}`;
      line.textContent = text;
      terminalOutput.appendChild(line);
      scrollTerminal();
    }

    function scrollTerminal() {
      terminalContent.scrollTop = terminalContent.scrollHeight;
    }

    function runCommand(rawCommand) {
      const commandLine = rawCommand.trim();

      if (!commandLine) {
        addOutput("");
        return;
      }

      addOutput(`guest@ascii:~$ ${commandLine}`, "commandLine");

      const parts = commandLine.split(/\s+/);
      const command = parts[0].toLowerCase();
      const argument = parts.slice(1).join(" ");

      switch (command) {
        case "help":
        case "?":
          addOutput("AVAILABLE COMMANDS");
          addOutput("------------------");
          addOutput("help       Show available commands");
          addOutput("clear      Clear terminal output");
          addOutput("ascii      Show the current ASCII");
          addOutput("next       Switch to the next ASCII file");
          addOutput("list       List the ASCII files");
          addOutput("about      Show terminal information");
          addOutput("date       Show the current date and time");
          addOutput("echo TEXT  Print text");
          addOutput("whoami     Show the current user");
          addOutput("glitch     Trigger a glitch");
          addOutput("reboot     Restart the intro");
          addOutput("");
          break;

        case "clear":
        case "cls":
          terminalOutput.innerHTML = "";
          break;

        case "ascii":
        case "show":
          displayAscii(currentAsciiIndex);
          addOutput("ASCII display refreshed.");
          break;

        case "next":
          if (loadedAscii.length < 2) {
            addOutput("Only one ASCII file loaded.", "muted");
          } else {
            displayAscii(currentAsciiIndex + 1);
            addOutput(
              `Displayed ASCII file ${currentAsciiIndex + 1}.`
            );
          }
          break;

        case "list":
        case "ls":
          addOutput("ASCII FILES");

          asciiFiles.forEach((url, index) => {
            const filename = url.split("/").pop();
            const marker = index === currentAsciiIndex ? "*" : " ";
            addOutput(`${marker} ${filename}`);
          });

          addOutput("");
          break;

        case "about":
          addOutput("ASCII COMMAND TERMINAL");
          addOutput("Monochrome interactive terminal interface.");
          addOutput("Type commands at the prompt.");
          addOutput("");
          break;

        case "date":
        case "time":
          addOutput(new Date().toString());
          break;

        case "echo":
          addOutput(argument);
          break;

        case "whoami":
          addOutput("guest");
          break;

        case "glitch":
          flashRandomBlock();
          flashScreen();
          addOutput("Glitch triggered.");
          break;

        case "reboot":
        case "restart":
          reboot();
          break;

        default:
          addOutput(
            `Command not found: ${command}. Type "help" for commands.`,
            "errorLine"
          );
      }
    }

    async function reboot() {
      introRun++;
      stopGlitches();

      terminalScreen.classList.remove("visible");
      introScreen.classList.remove("hidden");

      await wait(450);
      runIntro();
    }

    commandForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const command = commandInput.value;

      if (command.trim()) {
        commandHistory.push(command);
      }

      historyIndex = commandHistory.length;
      runCommand(command);

      commandInput.value = "";
      commandInput.focus();
    });

    commandInput.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp") {
        event.preventDefault();

        if (!commandHistory.length) {
          return;
        }

        historyIndex = Math.max(0, historyIndex - 1);
        commandInput.value = commandHistory[historyIndex];
      }

      if (event.key === "ArrowDown") {
        event.preventDefault();

        if (!commandHistory.length) {
          return;
        }

        historyIndex = Math.min(
          commandHistory.length,
          historyIndex + 1
        );

        commandInput.value =
          historyIndex === commandHistory.length
            ? ""
            : commandHistory[historyIndex];
      }

      if (event.key === "Tab") {
        event.preventDefault();

        const commands = [
          "help",
          "clear",
          "ascii",
          "next",
          "list",
          "about",
          "date",
          "echo ",
          "whoami",
          "glitch",
          "reboot"
        ];

        const currentText = commandInput.value.toLowerCase();

        const match = commands.find((command) =>
          command.startsWith(currentText)
        );

        if (match) {
          commandInput.value = match;
        }
      }
    });

    document.addEventListener("click", () => {
      if (terminalScreen.classList.contains("visible")) {
        commandInput.focus();
      }
    });

    async function start() {
      try {
        introStatus.textContent = "LOADING ASCII FILES...";
        loadedAscii = await loadAllAsciiFiles();

        if (!loadedAscii.length) {
          showError(
            "ASCII FILE ERROR\n\n" +
            "GitHub could not load the TXT files.\n\n" +
            "Check that the repository is public and the filenames are exact."
          );
        }

        runIntro();
      } catch (error) {
        console.error("Startup error:", error);

        showError(
          "TERMINAL STARTUP ERROR\n\n" +
          "Open the browser console with F12."
        );

        runIntro();
      }
    }

    window.addEventListener("load", start);
  </script>
</body>
</html>
