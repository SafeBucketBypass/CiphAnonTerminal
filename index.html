<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Terminal</title>

  <style>
    :root {
      --background: #ffffff;
      --foreground: #000000;
      --muted: #555555;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
      color: var(--foreground);
      font-family: "Courier New", Courier, monospace;
    }

    body {
      transition:
        background-color 0.06s linear,
        color 0.06s linear,
        filter 0.06s linear;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    /* Random black-and-white glitch blocks */
    #glitchBlocks {
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow: hidden;
      pointer-events: none;
    }

    .glitchBlock {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .glitchBlock.black {
      background: #000000;
    }

    .glitchBlock.white {
      background: #ffffff;
      border: 1px solid #000000;
    }

    .glitchBlock.active {
      animation: glitchBlockFlash 0.2s steps(2, end);
    }

    @keyframes glitchBlockFlash {
      0% {
        opacity: 0;
        transform: translateX(0);
      }

      20% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
        transform: translateX(12px);
      }

      100% {
        opacity: 0;
        transform: translateX(-10px);
      }
    }

    /* Full-screen black-and-white flashes */
    #screenFlash {
      position: fixed;
      inset: 0;
      z-index: 45;
      opacity: 0;
      pointer-events: none;
      background: #000000;
    }

    #screenFlash.active {
      animation: screenFlashAnimation 0.16s steps(2, end);
    }

    @keyframes screenFlashAnimation {
      0% {
        opacity: 0;
        background: #000000;
      }

      25% {
        opacity: 0.85;
        background: #ffffff;
      }

      55% {
        opacity: 0.7;
        background: #000000;
      }

      100% {
        opacity: 0;
        background: #ffffff;
      }
    }

    /* Scan lines */
    #scanlines {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.12) 4px
      );
      mix-blend-mode: multiply;
    }

    #scanlines.active {
      opacity: 1;
      animation: scanlineMove 0.2s steps(2, end) infinite;
    }

    @keyframes scanlineMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 14px;
      }
    }

    /* Intro loading screen */
    #introScreen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: #ffffff;
      color: #000000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #introScreen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #introBox {
      width: min(1000px, 94vw);
      text-align: center;
    }

    #introTitle {
      margin-bottom: 18px;
      font-size: clamp(12px, 2vw, 19px);
      font-weight: bold;
      letter-spacing: 3px;
    }

    #introStatus {
      min-height: 23px;
      margin-bottom: 20px;
      color: #333333;
      font-size: clamp(10px, 1.4vw, 15px);
      letter-spacing: 1px;
    }

    #introAscii {
      max-width: 100%;
      max-height: 58vh;
      margin: 0 auto;
      overflow: hidden;
      white-space: pre;
      text-align: center;
      color: #000000;
      font-size: clamp(7px, 1.15vw, 17px);
      line-height: 1.12;
      font-weight: bold;
    }

    #loadingBar {
      width: min(700px, 90vw);
      height: 15px;
      margin: 28px auto 0;
      padding: 2px;
      border: 2px solid #000000;
      background: #ffffff;
    }

    #loadingProgress {
      width: 0%;
      height: 100%;
      background: #000000;
      transition: width 0.08s linear;
    }

    /* Main white terminal */
    #terminalScreen {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      color: #000000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    #terminalScreen.visible {
      opacity: 1;
      visibility: visible;
    }

    #terminalHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 24px;
      border-bottom: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      font-size: 13px;
      letter-spacing: 1px;
    }

    #headerStatus {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #statusDot {
      width: 9px;
      height: 9px;
      background: #000000;
      animation: blink 0.85s steps(1, end) infinite;
    }

    #terminalContent {
      flex: 1;
      overflow-y: auto;
      padding: 30px clamp(15px, 7vw, 120px) 125px;
      scroll-behavior: smooth;
      background: #ffffff;
    }

    #asciiArt {
      max-width: 100%;
      margin: 0 auto 35px;
      overflow-x: auto;
      white-space: pre;
      text-align: center;
      color: #000000;
      font-size: clamp(7px, 1.15vw, 17px);
      line-height: 1.12;
      font-weight: bold;
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.35);
    }

    #terminalOutput {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: #000000;
      font-size: clamp(12px, 1.45vw, 16px);
      line-height: 1.6;
    }

    .outputLine {
      min-height: 1.6em;
    }

    .commandLine {
      font-weight: bold;
    }

    .muted {
      color: var(--muted);
    }

    .errorLine {
      text-decoration: underline;
    }

    /* Bottom input bar */
    #commandForm {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 62px;
      padding: 17px 24px;
      border-top: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      font-size: clamp(12px, 1.5vw, 17px);
    }

    #prompt {
      flex: 0 0 auto;
      color: #000000;
      font-weight: bold;
      white-space: nowrap;
    }

    #commandInput {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 0;
      background: transparent;
      color: #000000;
      caret-color: #000000;
      font: inherit;
    }

    #commandInput::placeholder {
      color: #555555;
      opacity: 1;
    }

    #cursor {
      width: 10px;
      height: 19px;
      flex: 0 0 auto;
      background: #000000;
      animation: blink 0.85s steps(1, end) infinite;
    }

    @keyframes blink {
      0%,
      45% {
        opacity: 1;
      }

      46%,
      100% {
        opacity: 0;
      }
    }

    /* Error message */
    #errorMessage {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 100;
      width: min(550px, 88vw);
      padding: 22px;
      transform: translate(-50%, -50%);
      border: 2px solid #000000;
      background: #ffffff;
      color: #000000;
      text-align: center;
      white-space: pre-wrap;
    }

    #errorMessage.visible {
      display: block;
    }

    .invert {
      filter: invert(1);
    }

    @media (max-width: 600px) {
      #introAscii,
      #asciiArt {
        font-size: 7px;
      }

      #terminalHeader {
        padding: 14px;
        font-size: 10px;
      }

      #terminalContent {
        padding: 20px 12px 115px;
      }

      #commandForm {
        min-height: 56px;
        padding: 14px 12px;
      }

      #prompt {
        font-size: 11px;
      }

      #cursor {
        width: 8px;
        height: 15px;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <div id="glitchBlocks"></div>
    <div id="screenFlash"></div>
    <div id="scanlines"></div>

    <section id="introScreen">
      <div id="introBox">
        <div id="introTitle">INITIALIZING ASCII TERMINAL</div>
        <div id="introStatus">CONNECTING...</div>

        <pre id="introAscii"></pre>

        <div id="loadingBar">
          <div id="loadingProgress"></div>
        </div>
      </div>
    </section>

    <section id="terminalScreen">
      <header id="terminalHeader">
        <span>ASCII COMMAND TERMINAL</span>

        <span id="headerStatus">
          <span id="statusDot"></span>
          ONLINE
        </span>
      </header>

      <div id="terminalContent">
        <pre id="asciiArt"></pre>
        <div id="terminalOutput"></div>
      </div>

      <form id="commandForm" autocomplete="off">
        <span id="prompt">guest@ascii:~$</span>

        <input
          id="commandInput"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="type help to see commands"
        />

        <span id="cursor"></span>
      </form>
    </section>

    <div id="errorMessage"></div>
  </main>

  <script>
    /*
      Your TXT file is loaded here.
      This keeps the ASCII external instead of embedding it in the HTML.
    */

    const asciiFile = "./1000016546-ascii.txt";

    const settings = {
      introDuration: 7000,
      typingSpeed: 8,
      glitchChance: 0.82,
      blockCount: 20,
      glitchInterval: 125
    };

    const introScreen = document.getElementById("introScreen");
    const introStatus = document.getElementById("introStatus");
    const introAscii = document.getElementById("introAscii");
    const loadingProgress = document.getElementById("loadingProgress");

    const terminalScreen = document.getElementById("terminalScreen");
    const terminalContent = document.getElementById("terminalContent");
    const asciiArt = document.getElementById("asciiArt");
    const terminalOutput = document.getElementById("terminalOutput");

    const commandForm = document.getElementById("commandForm");
    const commandInput = document.getElementById("commandInput");

    const glitchBlocks = document.getElementById("glitchBlocks");
    const screenFlash = document.getElementById("screenFlash");
    const scanlines = document.getElementById("scanlines");
    const errorMessage = document.getElementById("errorMessage");

    const introMessages = [
      "CONNECTING TO TERMINAL...",
      "CHECKING ASCII FILE...",
      "READING TEXT DATA...",
      "RENDERING ASCII...",
      "APPLYING DISPLAY EFFECTS...",
      "STARTING COMMAND INPUT...",
      "SYSTEM READY."
    ];

    let asciiText = "";
    let commandHistory = [];
    let historyIndex = -1;
    let glitchTimer = null;
    let introRunId = 0;
    let introComplete = false;

    function randomNumber(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function wait(milliseconds) {
      return new Promise((resolve) => {
        setTimeout(resolve, milliseconds);
      });
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add("visible");

      setTimeout(() => {
        errorMessage.classList.remove("visible");
      }, 7000);
    }

    /*
      Loads the TXT file from the same folder as index.html.
    */
    async function loadAsciiFile() {
      const response = await fetch(asciiFile, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(
          `Could not load ${asciiFile}. HTTP status: ${response.status}`
        );
      }

      const text = await response.text();

      if (!text.trim()) {
        throw new Error("The ASCII TXT file is empty.");
      }

      return text;
    }

    function createGlitchBlocks() {
      glitchBlocks.innerHTML = "";

      for (let i = 0; i < settings.blockCount; i++) {
        const block = document.createElement("div");
        block.className = "glitchBlock";
        glitchBlocks.appendChild(block);
      }
    }

    function flashRandomBlock() {
      const blocks = glitchBlocks.querySelectorAll(".glitchBlock");

      if (!blocks.length || Math.random() > settings.glitchChance) {
        return;
      }

      const block = blocks[randomNumber(0, blocks.length - 1)];

      block.classList.remove("black", "white", "active");

      if (Math.random() > 0.5) {
        block.classList.add("black");
      } else {
        block.classList.add("white");
      }

      block.style.left = `${randomNumber(-5, 95)}%`;
      block.style.top = `${randomNumber(-5, 95)}%`;
      block.style.width = `${randomNumber(2, 35)}%`;
      block.style.height = `${randomNumber(1, 18)}%`;

      void block.offsetWidth;
      block.classList.add("active");

      setTimeout(() => {
        block.classList.remove("active");
      }, randomNumber(100, 280));
    }

    function flashScreenNow() {
      if (Math.random() > settings.glitchChance) {
        return;
      }

      screenFlash.classList.remove("active");
      void screenFlash.offsetWidth;
      screenFlash.classList.add("active");

      if (Math.random() > 0.5) {
        document.body.classList.add("invert");

        setTimeout(() => {
          document.body.classList.remove("invert");
        }, randomNumber(50, 170));
      }
    }

    function startGlitches() {
      createGlitchBlocks();
      scanlines.classList.add("active");

      glitchTimer = setInterval(() => {
        flashRandomBlock();
        flashScreenNow();
      }, settings.glitchInterval);
    }

    function stopGlitches() {
      clearInterval(glitchTimer);
      glitchTimer = null;
      scanlines.classList.remove("active");
      document.body.classList.remove("invert");
      screenFlash.classList.remove("active");
    }

    async function typeIntroAscii(text, runId) {
      introAscii.textContent = "";

      for (let i = 0; i < text.length; i++) {
        if (runId !== introRunId) {
          return;
        }

        introAscii.textContent += text[i];

        if (i % 15 === 0) {
          flashRandomBlock();
        }

        if (i % 32 === 0) {
          flashScreenNow();
        }

        await wait(settings.typingSpeed);
      }
    }

    async function runIntro() {
      const runId = ++introRunId;
      const startTime = Date.now();

      introComplete = false;
      introAscii.textContent = "";
      loadingProgress.style.width = "0%";
      introStatus.textContent = "CONNECTING...";

      startGlitches();

      const typingPromise = typeIntroAscii(
        asciiText || "ASCII FILE COULD NOT BE LOADED",
        runId
      );

      const progressTimer = setInterval(() => {
        if (runId !== introRunId) {
          clearInterval(progressTimer);
          return;
        }

        const elapsed = Date.now() - startTime;
        const percentage = Math.min(
          100,
          (elapsed / settings.introDuration) * 100
        );

        loadingProgress.style.width = `${percentage}%`;

        const messageIndex = Math.min(
          introMessages.length - 1,
          Math.floor((percentage / 100) * introMessages.length)
        );

        introStatus.textContent = introMessages[messageIndex];

        if (percentage >= 100) {
          clearInterval(progressTimer);
        }
      }, 70);

      await typingPromise;

      const remaining =
        settings.introDuration - (Date.now() - startTime);

      if (remaining > 0) {
        await wait(remaining);
      }

      if (runId === introRunId) {
        finishIntro();
      }
    }

    function finishIntro() {
      if (introComplete) {
        return;
      }

      introComplete = true;
      stopGlitches();

      introScreen.classList.add("hidden");
      terminalScreen.classList.add("visible");

      asciiArt.textContent = asciiText;

      setTimeout(() => {
        addOutput("System ready.");
        addOutput(`Loaded: ${asciiFile}`, "muted");
        addOutput('Type "help" to see available commands.', "muted");
        addOutput("");
        commandInput.focus();
      }, 700);
    }

    function addOutput(text = "", className = "") {
      const line = document.createElement("div");
      line.className = `outputLine ${className}`;
      line.textContent = text;
      terminalOutput.appendChild(line);
      scrollTerminal();
    }

    function scrollTerminal() {
      terminalContent.scrollTop = terminalContent.scrollHeight;
    }

    function executeCommand(rawCommand) {
      const commandLine = rawCommand.trim();

      if (!commandLine) {
        addOutput("");
        return;
      }

      addOutput(`guest@ascii:~$ ${commandLine}`, "commandLine");

      const parts = commandLine.split(/\s+/);
      const command = parts[0].toLowerCase();
      const argument = parts.slice(1).join(" ");

      switch (command) {
        case "help":
        case "?":
          addOutput("AVAILABLE COMMANDS");
          addOutput("------------------");
          addOutput("help       Show available commands");
          addOutput("clear      Clear terminal output");
          addOutput("ascii      Redisplay the ASCII");
          addOutput("about      Show terminal information");
          addOutput("status     Show simulated status");
          addOutput("date       Show the current date and time");
          addOutput("echo TEXT  Print text");
          addOutput("whoami     Show the current user");
          addOutput("glitch     Trigger a visual glitch");
          addOutput("reboot     Restart the intro sequence");
          addOutput("");
          break;

        case "clear":
        case "cls":
          terminalOutput.innerHTML = "";
          break;

        case "ascii":
        case "show":
          asciiArt.textContent = asciiText;
          addOutput("ASCII display refreshed.");
          break;

        case "about":
          addOutput("ASCII COMMAND TERMINAL");
          addOutput("White background / black text interface.");
          addOutput("The TXT file is loaded from the local project folder.");
          addOutput("Visual effects are fictional and local only.");
          addOutput("");
          break;

        case "status":
          addOutput("ASCII FILE   LOADED");
          addOutput("DISPLAY      ONLINE");
          addOutput("INPUT        READY");
          addOutput("NETWORK      NOT USED");
          addOutput("");
          break;

        case "date":
        case "time":
          addOutput(new Date().toString());
          break;

        case "echo":
          addOutput(argument);
          break;

        case "whoami":
          addOutput("guest");
          break;

        case "glitch":
          flashRandomBlock();
          flashScreenNow();
          addOutput("Glitch effect triggered.");
          break;

        case "reboot":
        case "restart":
          rebootTerminal();
          break;

        default:
          addOutput(
            `Command not found: ${command}. Type "help" for commands.`,
            "errorLine"
          );
      }
    }

    async function rebootTerminal() {
      introRunId++;
      stopGlitches();

      terminalScreen.classList.remove("visible");
      introScreen.classList.remove("hidden");
      terminalOutput.innerHTML = "";

      await wait(450);
      runIntro();
    }

    commandForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const command = commandInput.value;

      if (command.trim()) {
        commandHistory.push(command);
      }

      historyIndex = commandHistory.length;
      executeCommand(command);

      commandInput.value = "";
      commandInput.focus();
    });

    commandInput.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp") {
        event.preventDefault();

        if (!commandHistory.length) {
          return;
        }

        historyIndex = Math.max(0, historyIndex - 1);
        commandInput.value = commandHistory[historyIndex];
      }

      if (event.key === "ArrowDown") {
        event.preventDefault();

        if (!commandHistory.length) {
          return;
        }

        historyIndex = Math.min(
          commandHistory.length,
          historyIndex + 1
        );

        commandInput.value =
          historyIndex === commandHistory.length
            ? ""
            : commandHistory[historyIndex];
      }

      if (event.key === "Tab") {
        event.preventDefault();

        const commands = [
          "help",
          "clear",
          "ascii",
          "about",
          "status",
          "date",
          "echo ",
          "whoami",
          "glitch",
          "reboot"
        ];

        const typedText = commandInput.value.toLowerCase();

        const match = commands.find((command) =>
          command.startsWith(typedText)
        );

        if (match) {
          commandInput.value = match;
        }
      }
    });

    document.addEventListener("click", () => {
      if (terminalScreen.classList.contains("visible")) {
        commandInput.focus();
      }
    });

    async function start() {
      try {
        introStatus.textContent = "LOADING ASCII FILE...";
        asciiText = await loadAsciiFile();
        runIntro();
      } catch (error) {
        console.error(error);

        asciiText =
          "ASCII FILE ERROR\n\n" +
          "Could not load 1000016546-ascii.txt";

        showError(
          "ASCII FILE ERROR\n\n" +
          "Make sure this file is beside index.html:\n\n" +
          "1000016546-ascii.txt"
        );

        runIntro();
      }
    }

    /*
      Important:
      If you open index.html by double-clicking it, some browsers block
      loading local TXT files with fetch().

      Run the folder with a local server:

      python -m http.server

      Then open:

      http://localhost:8000

      GitHub Pages should load it normally.
    */

    window.addEventListener("load", start);
  </script>
</body>
</html>
